name: Render PDF

on:
  push:
    branches: [ Fall25 ]
    paths:
      - '**/*.ipynb'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (nbconvert + Chromium)
        run: |
          python -m pip install --upgrade pip
          pip install "nbconvert[webpdf]" jupyter nbformat
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Convert all notebooks to PDF (no execution)
        shell: bash
        run: |
          shopt -s globstar nullglob
          for nb in **/*.ipynb; do
            jupyter nbconvert --to webpdf "$nb" --output "${nb%.ipynb}.pdf"
          done

      - name: Commit PDFs back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add **/*.pdf
          git commit -m "convert notebook to PDF" || echo "no PDF changes"
          git push

