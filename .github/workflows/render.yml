name: Render PDF (Quarto)

on:
  push:
    branches: [ Fall25 ]
    paths:
      - '**/*.ipynb'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Quarto + TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.31
          tinytex: true

      - name: Ensure LaTeX packages (common PDF deps)
        run: |
          tlmgr update --self --all
          tlmgr install latexmk xetex amsmath amsfonts hyperref geometry xcolor fancyvrb upquote microtype parskip fontspec unicode-math \
                          listings caption float graphics graphics-def grfext kvoptions pdftexcmds iftex etoolbox setspace

      - name: Convert notebooks to PDF (recursive)
        shell: bash
        run: |
          shopt -s globstar nullglob
          for file in **/*.ipynb; do
            echo "Rendering: $file"
            quarto render "$file" --to pdf
          done

      - name: Commit PDFs back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add **/*.pdf
          git commit -m "convert notebook to PDF" || echo "no pdf changes"
          git push

